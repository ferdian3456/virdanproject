name: Optimized Go CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  # Bump deliberately, never use @latest (non-deterministic builds + supply-chain risk)
  GO_VERSION: "1.25.10"
  GOLANGCI_LINT_VERSION: "v1.64.8"
  GOVULNCHECK_VERSION: "v1.1.4"
  SWAG_VERSION: "v1.16.4"

jobs:
  setup:
    name: Setup Go Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: go build -o app ./cmd/main.go

  generate_swagger:
    name: Generate Swagger (auto-commit on main)
    runs-on: ubuntu-latest
    needs: setup
    # Only on push to main: regenerate docs/swagger.yaml from docs/flows/id and
    # commit it back. Devs never need to generate swagger locally + commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install swag
        env:
          VERSION: ${{ env.SWAG_VERSION }}
        run: go install "github.com/swaggo/swag/cmd/swag@${VERSION}"

      - name: Generate swagger.yaml from docs/flows/id
        run: make generate-swagger-id

      - name: Commit regenerated swagger.yaml if changed
        run: |
          if git diff --quiet -- docs/swagger.yaml; then
            echo "docs/swagger.yaml unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/swagger.yaml
          git commit -m "chore: regenerate docs/swagger.yaml [skip ci]"
          git push origin HEAD:main

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install golangci-lint
        env:
          VERSION: ${{ env.GOLANGCI_LINT_VERSION }}
        run: go install "github.com/golangci/golangci-lint/cmd/golangci-lint@${VERSION}"

      - name: Run golangci-lint
        run: golangci-lint run ./...

  vuln_check:
    name: Vulnerability Check (govulncheck)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        env:
          VERSION: ${{ env.GOVULNCHECK_VERSION }}
        run: go install "golang.org/x/vuln/cmd/govulncheck@${VERSION}"

      # Scope to production packages. tests/integration pulls in testcontainers
      # which transitively imports github.com/docker/docker, and several of
      # those vulns have "Fixed in: N/A". Scanning the test path would
      # always-red the gate without any actionable fix.
      - name: Run govulncheck
        run: govulncheck ./cmd/... ./services/... ./shared/...

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [setup, lint, vuln_check]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install test dependencies
        env:
          VERSION: ${{ env.GOLANGCI_LINT_VERSION }}
        run: go install "github.com/golangci/golangci-lint/cmd/golangci-lint@${VERSION}"

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ hashFiles('tests/integration/setup/containers.go') }}
          restore-keys: |
            docker-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker containers for integration tests
        run: |
          echo "Waiting for Docker daemon to be ready..."
          timeout 60 sh -c "until docker info >/dev/null 2>&1; do sleep 1; done" || {
            echo "Docker daemon not ready after 60 seconds"
            exit 1
          }
          echo "Docker daemon is ready"

      - name: Pull Docker images
        run: |
          echo "Pulling required Docker images..."
          docker pull postgres:15-alpine &
          docker pull redis:7-alpine &
          docker pull minio/minio:latest &
          docker pull mailhog/mailhog:latest &
          wait
          echo "All images pulled successfully"

      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          go test -v -timeout 10m ./tests/integration/... 2>&1 | tee test-results.txt
        env:
          # Testcontainers environment variables
          TESTCONTAINERS_DOCKER_SOCKET: /var/run/docker.sock
          # Database config (testcontainers will override these)
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: virdan_test
          # Redis config (testcontainers will override these)
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # MinIO config (testcontainers will override these)
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_USE_SSL: false
          # MailHog config (testcontainers will override these)
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          # App config
          ENVIRONMENT: test
          JWT_SECRET: test-secret-key-for-integration-testing
          SERVER_PORT: 8080

      - name: Generate test report
        if: always()
        run: |
          echo "## Integration Test Results" > test-report.md
          echo "" >> test-report.md
          if [ -f test-results.txt ]; then
            echo '```' >> test-report.md
            grep -E "(PASS|FAIL|RUN)" test-results.txt >> test-report.md || true
            echo '```' >> test-report.md
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results.txt
            test-report.md
          retention-days: 30

      - name: Generate coverage
        if: always()
        run: |
          # Coverage on integration test packages. `|| true` because we still
          # want to upload partial output even when tests fail.
          go test -coverprofile=coverage.out -timeout 10m ./tests/integration/... || true
          if [ -f coverage.out ]; then
            go tool cover -html=coverage.out -o coverage.html
            # Tail line of `go tool cover -func` is the total coverage row.
            # Capture only the percentage so pr_comment can echo it directly.
            go tool cover -func=coverage.out | awk '/^total:/ {print $NF}' > coverage-total.txt
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.out
            coverage.html
            coverage-total.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Check test results
        if: always()
        run: |
          if grep -q "FAIL" test-results.txt 2>/dev/null; then
            echo "Integration tests failed"
            exit 1
          elif grep -q "PASS" test-results.txt 2>/dev/null; then
            echo "Integration tests passed"
            exit 0
          else
            echo "No test results found"
            exit 1
          fi

  build_push_image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, vuln_check, integration_tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build_push_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 100.95.62.4
          username: astrid
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/astrid/virdan/virdanproject
            docker compose -f docker-compose.full.yml pull app
            docker compose -f docker-compose.full.yml up -d app

  pr_comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [setup, lint, vuln_check, integration_tests]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Parse test results
        id: parse_results
        run: |
          TOTAL_TESTS=0
          PASSED_TESTS=0
          FAILED_TESTS=0
          COVERAGE_PERCENTAGE="N/A"

          if [ -f "artifacts/integration-test-results/test-results.txt" ]; then
            TEST_RESULTS=$(cat "artifacts/integration-test-results/test-results.txt")

            TOTAL_TESTS=$(echo "$TEST_RESULTS" | grep -c "^=== RUN" || true)
            PASSED_TESTS=$(echo "$TEST_RESULTS" | grep -c "^--- PASS:" || true)
            FAILED_TESTS=$(echo "$TEST_RESULTS" | grep -c "^--- FAIL:" || true)

            if [ "$FAILED_TESTS" -gt 0 ]; then
              echo "$TEST_RESULTS" \
                | grep "^--- FAIL:" \
                | sed 's/--- FAIL: \([^ ]*\).*/\1/' > failed_tests.txt
            fi
          fi

          if [ -f "artifacts/coverage-reports/coverage-total.txt" ]; then
            CT=$(tr -d '[:space:]' < artifacts/coverage-reports/coverage-total.txt)
            if [ -n "$CT" ]; then
              COVERAGE_PERCENTAGE="$CT"
            fi
          fi

          {
            echo "total_tests=$TOTAL_TESTS"
            echo "passed_tests=$PASSED_TESTS"
            echo "failed_tests=$FAILED_TESTS"
            echo "coverage=$COVERAGE_PERCENTAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Generate PR comment
        id: comment
        env:
          SETUP_STATUS: ${{ needs.setup.result }}
          LINT_STATUS: ${{ needs.lint.result }}
          VULN_STATUS: ${{ needs.vuln_check.result }}
          TEST_STATUS: ${{ needs.integration_tests.result }}
          TOTAL_TESTS: ${{ steps.parse_results.outputs.total_tests }}
          PASSED_TESTS: ${{ steps.parse_results.outputs.passed_tests }}
          FAILED_TESTS: ${{ steps.parse_results.outputs.failed_tests }}
          COVERAGE: ${{ steps.parse_results.outputs.coverage }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          render_status() {
            case "$1" in
              success)   echo "[PASS] Success" ;;
              failure)   echo "[FAIL] Failed" ;;
              cancelled) echo "[STOP] Cancelled" ;;
              skipped)   echo "[SKIP] Skipped" ;;
              *)         echo "[UNKNOWN] $1" ;;
            esac
          }

          {
            echo "## CI Pipeline Results"
            echo ""
            echo "### Overall Status"
            if [ "$TEST_STATUS" = "success" ] && [ "$LINT_STATUS" = "success" ] && [ "$VULN_STATUS" = "success" ]; then
              echo "All Checks Passed"
            elif [ "$TEST_STATUS" = "skipped" ]; then
              echo "Integration Tests Skipped — blocked by upstream failure"
            else
              echo "Some Checks Failed"
            fi
            echo ""
            echo "---"
            echo ""
            echo "### Job Status"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Setup | $(render_status "$SETUP_STATUS") |"
            echo "| Lint (golangci-lint) | $(render_status "$LINT_STATUS") |"
            echo "| Vuln Check (govulncheck) | $(render_status "$VULN_STATUS") |"
            echo "| Integration Tests | $(render_status "$TEST_STATUS") |"
            echo ""
            echo "### Integration Tests Summary"
            echo ""
          } > pr-comment.md

          if [ "$TEST_STATUS" = "skipped" ]; then
            REASON=""
            [ "$LINT_STATUS" = "failure" ]  && REASON="${REASON:+$REASON, }Lint failed"
            [ "$VULN_STATUS" = "failure" ]  && REASON="${REASON:+$REASON, }Vuln Check failed"
            [ "$SETUP_STATUS" = "failure" ] && REASON="${REASON:+$REASON, }Setup failed"
            [ -z "$REASON" ] && REASON="upstream dependency did not complete"
            {
              echo "Tests did not run."
              echo ""
              echo "Reason: $REASON. Fix upstream jobs and re-run to obtain test counts and coverage."
            } >> pr-comment.md
          else
            {
              echo "- Total Tests: $TOTAL_TESTS"
              echo "- Passed: $PASSED_TESTS"
              echo "- Failed: $FAILED_TESTS"
              echo "- Coverage: $COVERAGE"
            } >> pr-comment.md
          fi
          echo "" >> pr-comment.md

          if [ "$FAILED_TESTS" -gt 0 ] && [ -f failed_tests.txt ]; then
            {
              echo "### Failed Tests"
              echo ""
              while IFS= read -r test_name; do
                printf -- "- \`%s\`\n" "$test_name"
              done < failed_tests.txt
              echo ""
            } >> pr-comment.md
          fi

          {
            echo "---"
            echo ""
            echo "### Artifacts"
            echo ""
            echo "Detailed logs and reports are available in the [workflow run](https://github.com/${REPO}/actions/runs/${RUN_ID})."
            echo ""
            echo "<details>"
            echo "<summary>Test Results Details</summary>"
            echo ""
            echo '```'
            if [ -f "artifacts/integration-test-results/test-results.txt" ]; then
              grep -E "(RUN|PASS|FAIL)" artifacts/integration-test-results/test-results.txt | head -100 || true
            else
              echo "No test results captured (job skipped or failed before output)."
            fi
            echo '```'
            echo ""
            echo "</details>"
          } >> pr-comment.md

      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('pr-comment.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('CI Pipeline Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [setup, lint, vuln_check, integration_tests, build_push_image, deploy, pr_comment]
    if: always()
    steps:
      - name: Check all jobs status
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          VULN_RESULT: ${{ needs.vuln_check.result }}
          TEST_RESULT: ${{ needs.integration_tests.result }}
          IMAGE_RESULT: ${{ needs.build_push_image.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PR_COMMENT_RESULT: ${{ needs.pr_comment.result }}
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Setup | $SETUP_RESULT |"
            echo "| Lint (golangci-lint) | $LINT_RESULT |"
            echo "| Vuln Check (govulncheck) | $VULN_RESULT |"
            echo "| Integration Tests | $TEST_RESULT |"
            echo "| Build & Push Image | $IMAGE_RESULT |"
            echo "| Deploy to Production | $DEPLOY_RESULT |"
            echo "| PR Comment | $PR_COMMENT_RESULT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TEST_RESULT" != "success" ]; then
            echo "CI Pipeline Failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "CI Pipeline Passed" >> "$GITHUB_STEP_SUMMARY"
          fi
