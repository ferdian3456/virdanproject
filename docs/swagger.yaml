            end
            BE->>Postgres: SELECT server fields + memberCount + myNickname + myAvatar dari server_members JOIN servers JOIN profiles WHERE user_id = $1 (after cursor)
            BE->>BE: Bila len > limit, build nextCursor dari item ke-limit
