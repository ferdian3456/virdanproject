            alt Error Validasi
                BE-->>Client: 400 sessionId is required / is not a valid UUID
            end
            BE->>Redis: HMGET signup:(sessionId) step
            alt Session tidak ada
                BE-->>Client: 404 Signup session is expired or does not exist
            end
            BE-->>Client: 200 {sessionId, step}
        ```

        ---

        ## Notes Redis

