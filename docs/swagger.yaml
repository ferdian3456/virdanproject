        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ValidationError'
      summary: Create a new post
      tags:
      - posts
  /servers/{serverId}/posts/{postId}:
    delete:
      description: |
        ## Delete Post Flow

        ### Overview
        Deletes a post from a server. Only the post author and server member can delete the post. Cascade deletes comments, likes, and also removes the image from MinIO.

        ### Auth
        Requires `Authorization` header with Bearer JWT access token.

        ### Business Logic
        1. Get `userId` from context
        2. Parse `serverId` and `postId` from URL path — must be valid UUIDs
        3. Check if user is a member of the server
        4. Check if user is the author of the post
        5. Begin database transaction
        6. Get post image info (imageId, objectKey)
        7. Delete post from database (CASCADE deletes comments and likes)
        8. Delete post image record from database
        9. Commit transaction
        10. Delete image file from MinIO

        ### Error Cases
        - Invalid serverId → `400` with "Invalid server id"
        - Invalid postId → `400` with "Invalid post id"
        - Not a member → `400` with "You are not a member of this server"
        - Not the author → `400` with "You are not the author of this post"
        - Post not found (no image) → `400` with "Post not found"

        ### Flow
        ```
        Request → Auth Middleware → Parse Params → Check Membership (DB) → Check Ownership (DB) → Begin TX → Get Image Info → Delete Post (DB, CASCADE) → Delete Image Record (DB) → Commit TX → Delete Image (MinIO) → Response (no data)
        ```
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Server UUID
        in: path
        name: serverId
        required: true
        type: string
      - description: Post UUID
        in: path
        name: postId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ValidationError'
      summary: Delete a post
      tags:
      - posts
    put:
      consumes:
      - application/json
      description: |
        ## Update Post Flow

        ### Overview
        Updates the caption of an existing post. Only the post author and server member can update the post.

        ### Auth
        Requires `Authorization` header with Bearer JWT access token.

        ### Business Logic
        1. Get `userId` from context
        2. Parse `serverId` and `postId` from URL path — must be valid UUIDs
        3. Parse request body for `caption` (required)
        4. Check if user is a member of the server
        5. Check if user is the author of the post
        6. Update post caption in database
        7. Fetch and return updated post details

        ### Error Cases
        - Invalid serverId → `400` with "Invalid server id"
        - Invalid postId → `400` with "Invalid post id"
        - Invalid request body → `400` with `ERR_INVALID_REQUEST_BODY`
        - Caption empty → `400` with "Caption is required"
        - Not a member → `400` with "You are not a member of this server"
        - Not the author → `400` with "You are not the author of this post"

        ### Flow
        ```
        Request → Auth Middleware → Parse Params → Parse Body → Check Membership (DB) → Check Ownership (DB) → Update Caption (DB) → Get Post (DB) → Response
        ```
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Server UUID
        in: path
        name: serverId
        required: true
        type: string
      - description: Post UUID
        in: path
        name: postId
        required: true
        type: string
      - description: Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ServerPostUpdateCaptionRequest'
      produces:
