        }
        ```

        ### 403 Forbidden

        | `error_message`                       | Penyebab               |
        | ------------------------------------- | ---------------------- |
        | `You are not a member of this server` | Requester bukan member |

        ### 401 Unauthorized

        Standard auth errors.

