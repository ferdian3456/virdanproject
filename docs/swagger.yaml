        | `postId`   | string | ya    | Required, UUID  |

        Body JSON:

        | Field     | Tipe   | Wajib | Aturan                       |
        | --------- | ------ | ----- | ---------------------------- |
        | `caption` | string | ya    | Required, max 2000 karakter  |

        ---

