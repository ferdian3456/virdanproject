        {
          "profileId": "uuid",
          "serverId": "uuid",
          "nickname": "BudiPro",
          "username": "budipro",
          "bio": "Always grinding",
          "avatarImageId": "uuid-or-null",
          "avatarUrl": "https://...-or-null",
          "createdAt": "2026-06-01T10:30:00Z",
          "updatedAt": "2026-06-01T10:30:00Z"
        }
        ```

