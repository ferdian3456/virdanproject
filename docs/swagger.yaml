        | Field      | Tipe   | Wajib | Aturan          |
        | ---------- | ------ | ----- | --------------- |
        | `serverId` | string | ya    | Required, UUID  |

        Query parameter:

        | Field    | Tipe   | Wajib | Aturan                       |
        | -------- | ------ | ----- | ---------------------------- |
        | `limit`  | int    | tidak | 0..MAX_LIMIT (default)       |
        | `cursor` | string | tidak | Cursor dari response sebelumnya |

        ---

