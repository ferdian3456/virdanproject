        ## Auth

        API ini adalah api protected jadi perlu authorization header `Bearer <accessToken>`.

        ## Flow

        ```mermaid
        sequenceDiagram
            actor Client
            participant BE
            participant Postgres

            Client->>BE: PUT /api/servers/(id)/shortName {shortName}
