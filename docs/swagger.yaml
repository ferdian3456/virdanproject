            $ref: '#/definitions/model.ServerPostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ValidationError'
      summary: Update post caption
      tags:
      - posts
