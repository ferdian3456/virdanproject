        Allows an authenticated user to join a public (non-private) server directly without an invite code.

        ### Auth
        Requires `Authorization` header with Bearer JWT access token.

        ### Business Logic
        1. Get `userId` from context
        2. Parse `serverId` from URL path parameter — must be a valid UUID
        3. Check if server exists and is eligible to join (not private)
        4. Check if user is already a member — return error if already joined
        5. Create a "member" role for the user in this server
        6. Create server member record linking user to server
        7. All operations wrapped in a database transaction
        8. Return success with no data

        ### Error Cases
        - Invalid serverId → `400` with "Invalid server id"
        - Server not found or private → `400` with "Unable to join server because server is not exists or private"
        - Already a member → `400` with "Unable to join server because user is already a member"

        ### Flow
        ```
        Request → Auth Middleware → Parse ServerId → Check Server Eligible (DB) → Check Not Already Member (DB) → Begin TX → Create Role (DB) → Create Member (DB) → Commit TX → Response
        ```
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Server UUID
        in: path
        name: serverId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ValidationError'
      summary: Join a public server
      tags:
      - servers
  /servers/{serverId}/posts:
    get:
      description: |
        ## Get Server Posts Flow

        ### Overview
        Retrieves a paginated list of posts from a specific server. Requires server membership. Uses cursor-based pagination.

        ### Auth
        Requires `Authorization` header with Bearer JWT access token.

        ### Business Logic
        1. Get `userId` from context
        2. Parse `serverId` from URL path — must be a valid UUID
        3. Parse query parameters: `limit`, `cursor`
        4. Validate `limit` (>= 0 and <= max limit)
        5. Check if user is a member of the server
        6. If cursor provided, decode and unmarshal
        7. Query posts from database (limit + 1 for cursor detection) with author info and image URLs
        8. Build next cursor if more data exists

        ### Query Parameters
        - `limit` — number of items per page (optional)
        - `cursor` — base64-encoded cursor for next page (optional)

        ### Error Cases
        - Invalid serverId → `400` with "Invalid server id"
        - Limit < 0 → `400` with "Limit must be greater or equal than 0"
        - Limit > max → `400` with "Limit is exceeded max limit: {max}"
        - Not a member → `400` with "You are not a member of this server"

        ### Flow
        ```
        Request → Auth Middleware → Parse Params → Validate Limit → Check Membership (DB) → Decode Cursor → Query Posts (DB) → Build Next Cursor → Response
        ```
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Server UUID
        in: path
        name: serverId
        required: true
        type: string
      - description: Items per page
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
