services:
  nginx:
    image: nginx:1.27-alpine
    container_name: virdanproject-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: virdanproject-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virdanproject-app
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: virdanproject-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - observability
    command:
      - -housekeeping_interval=10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:15.4
    container_name: virdanproject-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.2
    container_name: virdanproject-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000 --tcp-keepalive 60 --rdbcompression yes --rdbchecksum yes --activerehashing yes --hz 100 --dynamic-hz yes --timeout 0 --tcp-backlog 511
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320M

  minio:
    image: minio/minio:latest
    container_name: virdanproject-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Observability Stack ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: virdanproject-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability-config/otel-collector/otel-collector.yaml:/etc/otel-collector-config.yaml
    networks:
      - observability
    depends_on:
      - tempo
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  loki:
    image: grafana/loki:3.3.2
    container_name: virdanproject-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability-config/loki/loki.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  tempo:
    image: grafana/tempo:2.7.2
    container_name: virdanproject-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability-config/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: virdanproject-prometheus
    volumes:
      - ./observability-config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.4.0
    container_name: virdanproject-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability-config/grafana/provisioning:/etc/grafana/provisioning
      - ./observability-config/grafana/dashboard:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SERVER_DOMAIN=virdan.cloud
      - GF_SERVER_ROOT_URL=https://virdan.cloud/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - observability
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # --- Exporters ---

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: virdanproject-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - observability
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: virdanproject-redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - observability
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  observability:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
