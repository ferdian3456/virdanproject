services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virdanproject-app
    env_file:
      - .env.docker
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: virdanproject-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - observability
    command:
      - -housekeeping_interval=10s

  postgres:
    image: postgres:15.4
    container_name: virdanproject-postgres
    environment:
      POSTGRES_USER: ferdian
      POSTGRES_PASSWORD: ferdian123
      POSTGRES_DB: virdanproject
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferdian -d virdanproject"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability

  redis:
    image: redis:7.2
    container_name: virdanproject-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000 --tcp-keepalive 60 --rdbcompression yes --rdbchecksum yes --activerehashing yes --hz 100 --dynamic-hz yes --timeout 0 --tcp-backlog 511
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - observability

  minio:
    image: minio/minio:latest
    container_name: virdanproject-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - observability

  # --- Observability Stack ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: virdanproject-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability-config/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Metrics
      - "8889:8889" # Prometheus metrics
    networks:
      - observability
    depends_on:
      - tempo
      - loki

  loki:
    image: grafana/loki:latest
    container_name: virdanproject-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability-config/loki.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3102:3100"
    networks:
      - observability

  tempo:
    image: grafana/tempo:latest
    container_name: virdanproject-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability-config/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: virdanproject-prometheus
    volumes:
      - ./observability-config/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: virdanproject-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability-config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability-config/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ./dashboard/virdan-dashboard.json:/etc/grafana/dashboards/virdan-dashboard.json
      - ./dashboard/virdan-production-unified.json:/etc/grafana/dashboards/virdan-production-unified.json
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=virdan.cloud
      - GF_SERVER_ROOT_URL=https://virdan.cloud/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - observability
    depends_on:
      - prometheus
      - tempo
      - loki

  # --- Exporters ---

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: virdanproject-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://ferdian:ferdian123@postgres:5432/virdanproject?sslmode=disable"
    networks:
      - observability
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: virdanproject-redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - observability
    depends_on:
      redis:
        condition: service_healthy

networks:
  observability:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
