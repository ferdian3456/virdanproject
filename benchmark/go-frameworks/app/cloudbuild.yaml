# Builds one image per framework: gcloud builds submit app --config app/cloudbuild.yaml
substitutions:
  _REPO: us-central1-docker.pkg.dev/go-bench-15205/bench
steps:
  - name: gcr.io/cloud-builders/docker
    id: stdlib
    waitFor: ['-']
    args: ['build', '--build-arg', 'FRAMEWORK=stdlib', '-t', '${_REPO}/stdlib:latest', '.']
  - name: gcr.io/cloud-builders/docker
    id: chi
    waitFor: ['-']
    args: ['build', '--build-arg', 'FRAMEWORK=chi', '-t', '${_REPO}/chi:latest', '.']
  - name: gcr.io/cloud-builders/docker
    id: gin
    waitFor: ['-']
    args: ['build', '--build-arg', 'FRAMEWORK=gin', '-t', '${_REPO}/gin:latest', '.']
  - name: gcr.io/cloud-builders/docker
    id: echo
    waitFor: ['-']
    args: ['build', '--build-arg', 'FRAMEWORK=echo', '-t', '${_REPO}/echo:latest', '.']
  - name: gcr.io/cloud-builders/docker
    id: fiber
    waitFor: ['-']
    args: ['build', '--build-arg', 'FRAMEWORK=fiber', '-t', '${_REPO}/fiber:latest', '.']
  - name: gcr.io/cloud-builders/docker
    id: fasthttp
    waitFor: ['-']
    args: ['build', '--build-arg', 'FRAMEWORK=fasthttp', '-t', '${_REPO}/fasthttp:latest', '.']
images:
  - ${_REPO}/stdlib:latest
  - ${_REPO}/chi:latest
  - ${_REPO}/gin:latest
  - ${_REPO}/echo:latest
  - ${_REPO}/fiber:latest
  - ${_REPO}/fasthttp:latest
options:
  machineType: E2_HIGHCPU_8
