receivers:
  # OTLP receiver for traces from virdan-api
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape cAdvisor for container metrics
  prometheus/cadvisor:
    config:
      scrape_configs:
        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']
          scrape_interval: 15s
          metrics_path: /metrics

  # File log receiver - Read logs from container stdout
  # Docker captures stdout to /var/lib/docker/containers/<id>/<id>-json.log
  filelog/virdan-api:
    include:
      - /var/log/containers/virdan-api*.log
    start_at: beginning
    include_file_name: false
    include_file_path: true
    operators:
      # Parse JSON logs from zap
      - type: json_parser
        parse_from: body
      # Extract trace_id for correlation
      - type: regex_parser
        regex: '"trace_id":"?(?P<trace_id>[0-9a-f]+)"?'
        field: body
      # Extract span_id for correlation
      - type: regex_parser
        regex: '"span_id":"?(?P<span_id>[0-9a-f]+)"?'
        field: body

processors:
  # Batch traces and logs before sending
  batch:
    timeout: 5s
    send_batch_size: 8192
    send_batch_max_size: 8192

  # Add memory limits and processing time limits
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Add attributes to all telemetry data
  resource/add_environment:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

  # Parse resource attributes from file path
  resource/docker:
    attributes:
      - key: service.name
        value: "virdan-api"
        action: upsert

exporters:
  # Export traces to Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    compression: gzip

  # Export metrics to VictoriaMetrics (Prometheus format)
  prometheusremotewrite/victoriametrics:
    endpoint: http://victoria:8428/api/v1/write
    tls:
      insecure: true
    timeout: 30s

  # Export logs to Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true

  # Debug exporter (for development)
  debug:
    verbosity: normal

service:
  pipelines:
    # Traces pipeline (from app via OTLP -> Tempo)
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [otlp/tempo, debug]

    # Metrics pipeline (from app via OTLP -> VictoriaMetrics)
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [prometheusremotewrite/victoriametrics, debug]

    # Container metrics pipeline (from cAdvisor -> VictoriaMetrics)
    metrics/container:
      receivers: [prometheus/cadvisor]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [prometheusremotewrite/victoriametrics]

    # Logs pipeline (from container stdout via filelog -> Loki)
    logs:
      receivers: [filelog/virdan-api]
      processors: [memory_limiter, resource/docker, batch]
      exporters: [loki, debug]

  # Telemetry for the collector itself
  telemetry:
    metrics:
      address: 0.0.0.0:9464
    logs:
      level: info

